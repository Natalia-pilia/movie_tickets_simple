<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Tickets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="theater">
        <div class="screen">
            <div class="line"></div>
            <p>Screen This Way</p>
        </div>
        <div class="top_seats">
            <div class="seats">
                <div class="letter">A</div>
                <div class="seat space"></div>
                <div class="seat space"></div>
                <div class="seat blue one"></div>
                <div class="seat white two"></div>
                <div class="seat red three"></div>
                <div class="seat white four"></div>
                <div class="seat red five"></div>
                <div class="seat space"></div>
                <div class="seat space"></div>
            </div>
            <div class="seats">
                <div class="letter">B</div>
                <div class="seat space"></div>
                <div class="seat red one"></div>
                <div class="seat white two"></div>
                <div class="seat red three"></div>
                <div class="seat white four"></div>
                <div class="seat red five"></div>
                <div class="seat white six"></div>
                <div class="seat red seven"></div>
                <div class="seat space"></div>
            </div>
        </div>

        <div class="bottom_seats">
            <div class="seats">
                <div class="letter">C</div>
                <div class="seat red one"></div>
                <div class="seat white two"></div>
                <div class="seat red three"></div>
                <div class="seat white four"></div>
                <div class="seat red five"></div>
                <div class="seat white six"></div>
                <div class="seat red seven"></div>
                <div class="seat white eight"></div>
                <div class="seat red nine"></div>
            </div>
            <div class="seats">
                <div class="letter">D</div>
                <div class="seat white one"></div>
                <div class="seat blue two"></div>
                <div class="seat white three"></div>
                <div class="seat blue four"></div>
                <div class="seat white five"></div>
                <div class="seat red six"></div>
                <div class="seat white seven"></div>
                <div class="seat red eight"></div>
                <div class="seat white nine"></div>
            </div>
            <div class="seats">
                <div class="letter">E</div>
                <div class="seat red one"></div>
                <div class="seat white two"></div>
                <div class="seat red three"></div>
                <div class="seat white four"></div>
                <div class="seat red five"></div>
                <div class="seat white six"></div>
                <div class="seat blue seven"></div>
                <div class="seat white eight"></div>
                <div class="seat red nine"></div>
            </div>
            <div class="seats">
                <div class="letter">F</div>
                <div class="seat white one"></div>
                <div class="seat red two"></div>
                <div class="seat white three"></div>
                <div class="seat blue four"></div>
                <div class="seat white five"></div>
                <div class="seat red six"></div>
                <div class="seat white seven"></div>
                <div class="seat red eight"></div>
                <div class="seat white nine"></div>
            </div>
        </div>
    </div>
</body>
</html>
